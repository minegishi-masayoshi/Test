# FIMS Cloud Ver.3.6.3
# Long-running nationwide Forest Constraint calculation.
#
# Loaded in nginx http context through /etc/nginx/conf.d/*.conf.
# Province calculations generally finish quickly; nationwide calculations
# may require several minutes.

proxy_connect_timeout 60s;
proxy_send_timeout 1800s;
proxy_read_timeout 1800s;
send_timeout 1800s;
